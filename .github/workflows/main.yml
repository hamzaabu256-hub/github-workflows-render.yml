name: Render Remotion Video

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يسمح لك بتشغيل الرندر يدوياً

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: ⚙️ تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # تمت إزالة cache: 'npm' لتجنب فشل التثبيت

      - name: 📦 تثبيت المكتبات (Dependencies)
        run: npm install

      - name: 🎬 تثبيت FFmpeg (مطلوب لـ Remotion)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🚀 رندر الفيديو
        # --gl=swangle ضروري لخوادم GitHub التي لا تحتوي على كروت شاشة
        # --overwrite لتجاوز أي ملفات قديمة
        run: npx remotion render src/index.ts intro out/video.mp4 --gl=swangle --concurrency=4 --overwrite

      - name: 💾 حفظ الفيديو كملف قابل للتنزيل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: out/video.mp4
          retention-days: 5
